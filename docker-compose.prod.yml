# Production stack: everything on one server behind a reverse proxy that is the only thing reachable from outside.
#
#   ops/dc up -d --build        (ops/dc is `docker compose --env-file .env.production -f docker-compose.prod.yml`)
#
# Settings come from .env.production (made from .env.production.example by ops/generate-secrets.sh).
# docker-compose.yml next to this file is the development setup (only the services, ports open, the app runs on the host).

name: iso-dms-prod

x-api-image: &api-image
  image: iso-dms-api:${APP_VERSION:-latest}
  build:
    context: .
    dockerfile: apps/api/Dockerfile

x-api-environment: &api-environment
  NODE_ENV: production
  TZ: Europe/Istanbul
  API_PORT: "4000"
  # Where the document server reaches the API (inside this network) and where the browser finds the application
  API_INTERNAL_URL: http://api:4000
  WEB_URL: https://${APP_HOST}
  # One reverse proxy (caddy) stands in front: the client address is in X-Forwarded-For
  TRUST_PROXY: "1"
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET}
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_ENDPOINT: storage
  S3_PORT: "9000"
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-documents}
  S3_USE_SSL: "false"
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  ONLYOFFICE_PUBLIC_URL: https://${DOCS_HOST}
  ONLYOFFICE_INTERNAL_URL: http://onlyoffice
  ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
  REDIS_URL: redis://redis:6379
  REDIS_QUEUE_PREFIX: iso-dms
  JOBS_ENABLED: "true"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-Kalite Doküman Yönetim Sistemi <noreply@localhost>}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST}
      DOCS_HOST: ${DOCS_HOST}
    volumes:
      # Caddyfile: certificates from Let's Encrypt (public name). Caddyfile.internal: the proxy's own certificate authority (internal network).
      - ./ops/caddy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    image: iso-dms-web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The browser calls the API on the same address (the proxy sends /api to it): no CORS, one certificate
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_ONLYOFFICE_URL: https://${DOCS_HOST}
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    <<: *api-image
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # 503 (database or files unreachable) fails the check; a queue or editor that is down only degrades
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Runs once at every start: brings the database up to date and makes sure the first data exists (it never changes
  # what is there). The API waits for it.
  migrate:
    <<: *api-image
    restart: "no"
    environment:
      <<: *api-environment
      SEED_ORGANIZATION_NAME: ${SEED_ORGANIZATION_NAME}
      SEED_ORGANIZATION_SLUG: ${SEED_ORGANIZATION_SLUG}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && pnpm exec prisma db seed"]
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Istanbul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      # The console is not needed in production (and is not published)
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  onlyoffice:
    image: onlyoffice/documentserver
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      # It has to reach the API (api:4000, a private address) to download files and post callbacks
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-lib:/var/lib/onlyoffice

volumes:
  postgres-data:
  storage-data:
  redis-data:
  onlyoffice-data:
  onlyoffice-lib:
  caddy-data:
  caddy-config:
